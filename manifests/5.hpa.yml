---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoScaler
metadata:
  name: hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment
  minReplicas: 3
  maxReplics: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilisation
          averageUtilisation: 60
